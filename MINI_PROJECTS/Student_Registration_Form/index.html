<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registeration Portal</title>
</head>

<body bgcolor = 'black' text = 'white'>

    <h1>Student Registeration Portal</h1>
	<h4>Welcome to XYZ Institute, please fill the registeration form below</h4>
	<hr>

	
	<h2>Student Profile</h2>
	
	<img src = 'https://www.svgrepo.com/show/384670/account-avatar-profile-user.svg' width = 200>

	<hr>
	<h2>Student Registeration Form</h2>


	<form>
	<label>Full Name</label>
	<input type="text" name="fullName" placeholder="Enter your full name">

	<br>
	<br>
	

	<label>Email</label>
	<input type="email" name="email" placeholder="Enter your email">

	<br>
	<br>

	<label>Password</label>
	<input type="password" name="password" placeholder="Enter your password">

	<br>
	<br>

	<label>Phone Number</label>
	<input type="tel" name="phone" placeholder="Enter your phone number">

	<br>
	<br>

	<label>Date of Birth</label>
	<input type="date" name="dob">

	<br>
	<br>

	<label>Gender</label>
	<select name="gender">
		<option value="">Select your gender</option>
		<option>Male</option>
		<option>Female</option>
		<option>Other</option>
	</select>

	<br>
	<br>

	<label>Skills</label>
	<input type="checkbox" name="skills" value="HTML"> HTML
	<input type="checkbox" name="skills" value="CSS"> CSS
	<input type="checkbox" name="skills" value="JavaScript"> JavaScript
	<input type="checkbox" name="skills" value="React"> React

	<br>
	<br>

	<label>Select Course</label>
	<select name="course">
		<option value="">Select your course</option>
		<option>Web Development</option>
		<option>Data Science</option>
		<option>UI/UX Design</option>
	</select>

	<br>
	<br>

	<label>Preferred Learning Mode</label>
	<input type="radio" name="mode" value="Online"> Online
	<input type="radio" name="mode" value="Offline"> Offline

	<br>
	<br>

	<button type="submit">Submit</button>
</form>



  

</body>
</html>
